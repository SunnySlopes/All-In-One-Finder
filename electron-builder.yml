appId: com.sunnyslopes.allinonefinder
productName: All-In-One Finder
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - '!dist/**/*.map'
  - electron/**/*
  - package.json
extraResources:
  - from: native/build/allinone.node
    to: native/allinone.node
  - from: native/build/libwinpthread-1.dll
    to: native/libwinpthread-1.dll
extraFiles:
  - from: native/build/libwinpthread-1.dll
    to: libwinpthread-1.dll
asar: true
asarUnpack:
  - electron/**
electronLanguages:
  - en-US
  - zh-CN
afterPack: scripts/after-pack.cjs
icon: build/icon.ico
win:
  icon: build/icon.ico
  target:
    - portable
npmRebuild: false
electronDist: node_modules/electron/dist
