<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>种子地图 — Minecraft Java 版</title>
    <meta
      name="description"
      content="离线可用的 Minecraft Java 版种子地图：群系、结构、史莱姆区块、出生点，以及群系区域搜索，全部用游戏自己的世界生成数据在本地计算。"
    />
    <meta name="color-scheme" content="dark" />
    <script type="module" crossorigin src="/assets/index-Cj3OyN-R.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CZajYar_.css">
  </head>
  <body>
    <div class="app">
      <!--
        Top bar. The menu is a real menu: every entry runs a command that already
        exists elsewhere in the UI (share, reset, zoom, grid, theme), so nothing
        here is decoration — see `buildMenuBar` in main.ts.
      -->
      <header class="appbar">
        <span class="brand"><span class="brand-dot"></span><span id="logo">种子地图</span></span>
        <nav class="menubar" id="menubar" aria-label="主菜单"></nav>
        <span class="appbar-meta">
          <span id="appbar-hint">Minecraft Java 版 1.18+ · 完全离线</span>
          <span class="appbar-date">数据更新：<time id="last-update">—</time></span>
        </span>
      </header>

      <div class="app-body">
        <aside class="sidebar" id="sidebar" aria-label="控制面板">
          <div class="sidebar-fixed">
            <!-- Version / seed / dimension: the three things every other control
                 depends on, so they stay pinned above the scroll area. -->
            <div class="side-globals" id="finder-app"></div>

            <div class="side-tabs" role="tablist" aria-label="面板">
              <button
                type="button"
                class="side-tab is-active"
                id="tab-btn-map"
                data-tab="map"
                role="tab"
                aria-selected="true"
                aria-controls="tab-map"
              >
                地图
              </button>
              <button
                type="button"
                class="side-tab"
                id="tab-btn-search"
                data-tab="search"
                role="tab"
                aria-selected="false"
                aria-controls="tab-search"
              >
                群系搜索
              </button>
            </div>
          </div>

          <div class="sidebar-scroll">
            <section class="tab-panel" id="tab-map" role="tabpanel" aria-labelledby="tab-btn-map">
              <details class="side-section" open>
                <summary>显示</summary>
                <div class="side-section-body" id="display-controls"></div>
              </details>

              <details class="side-section" open>
                <summary>特性</summary>
                <div class="side-section-body">
                  <div class="side-actions">
                    <button type="button" class="gh-button btn-sm" id="feature-all">全选</button>
                    <button type="button" class="gh-button btn-sm" id="feature-none">全不选</button>
                  </div>
                  <!-- Vertical checkbox list: denser than chips, and it reads as a
                       list of what is on rather than a scrolling strip. -->
                  <div class="feature-list" id="feature-toggles"></div>
                </div>
              </details>

              <details class="side-section" open>
                <summary>坐标</summary>
                <div class="side-section-body" id="jump-controls"></div>
              </details>
            </section>

            <section class="tab-panel" id="tab-search" role="tabpanel" aria-labelledby="tab-btn-search" hidden>
              <!--
                The search itself lives on its own screen (see `#search-screen`), laid out
                like the desktop searchers: parameters over results, with a progress line and
                an explicit run/pause/stop row. This tab is the way in, plus a summary of what
                the last run found, so the sidebar still answers "did it work" at a glance.
              -->
              <section class="search-launcher" id="search-launcher" aria-label="群系搜索">
                <button type="button" class="gh-button search-open" id="open-search-screen">
                  打开搜索界面
                </button>
                <p class="search-launcher-hint">
                  搜索期间会暂停地图渲染并释放它的工作进程，把内存让给搜索。
                </p>
                <p class="search-launcher-summary" id="search-launcher-summary"></p>
                <div class="search-launcher-results">
                  <span class="search-field-label" id="search-launcher-label"></span>
                  <ol class="search-results" id="search-results"></ol>
                </div>
              </section>
            </section>
          </div>

          <div class="sidebar-foot" id="search-foot" hidden>
            <!-- The stepper stays here: it is how a result is reviewed on the map, and the
                 search screen is closed by then. -->
            <div class="search-bar" id="search-bar" hidden></div>
          </div>
        </aside>

        <!--
          Drag to resize the control column. A real separator (focusable, arrow keys)
          rather than a bare div: the width is a user preference, so it has to be
          reachable without a mouse.
        -->
        <div
          class="sidebar-resizer"
          id="sidebar-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="调整控制栏宽度"
          tabindex="0"
        ></div>

        <main class="map-area">
          <div class="map-wrap" id="map-wrap">
            <div id="map-container" tabindex="0" aria-label="种子地图"></div>
            <div class="map-busy" id="map-busy" role="status" aria-label="正在生成">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
              </svg>
            </div>

            <!-- Visible-extent corners, like a map graticule label. -->
            <div class="map-corner map-corner-nw" id="map-corner-nw"></div>
            <div class="map-corner map-corner-ne" id="map-corner-ne"></div>
            <div class="map-corner map-corner-sw" id="map-corner-sw"></div>
            <div class="map-corner map-corner-se" id="map-corner-se"></div>

            <div class="map-buttons">
              <button type="button" data-map-action="zoom-in" title="放大（+）">+</button>
              <button type="button" data-map-action="zoom-out" title="缩小（-）">−</button>
              <button type="button" data-map-action="rotate-cw" title="顺时针旋转">⟳</button>
              <button type="button" data-map-action="rotate-ccw" title="逆时针旋转">⟲</button>
              <button type="button" data-map-action="expand" title="放大地图（T）">⤢</button>
            </div>

            <div class="map-search">
              <button type="button" id="map-search-button" title="群系搜索（S）">🔍</button>
            </div>

            <div class="map-coords" id="map-coords"></div>
            <div class="map-popover" id="map-popover" hidden></div>
          </div>

          <!--
            Shown only when the selected version has no structure definitions, so
            the structures on the map were placed on the grid alone and were never
            biome-checked. Populated by the UI layer.
          -->
          <div class="feature-notice" id="feature-notice" role="status" hidden></div>
        </main>

        <!--
          The search screen. A view of its own rather than a sidebar tab, following the
          desktop searchers this feature learned its architecture from (SlimeFinder /
          RiverFinder / LowYSwampHut): parameters on top, an explicit run/pause/stop row,
          one progress line with elapsed and remaining time, and the ranked results in a
          table underneath. While it is open the map is suspended and its worker pool is
          released — the map's engines were the largest memory term in the app, and a search
          is exactly when nobody is looking at it.
        -->
        <main class="search-screen" id="search-screen" hidden aria-label="群系区域搜索">
          <header class="ss-bar">
            <span class="ss-title">群系区域搜索</span>
            <span class="ss-context" id="ss-context"></span>
            <span class="ss-spacer"></span>
            <button type="button" class="gh-button" id="ss-back">返回地图</button>
          </header>

          <div class="ss-body">
            <section class="ss-params">
              <form class="search-form" id="search-form" novalidate></form>
              <div class="ss-run">
                <div class="ss-run-actions" id="search-actions"></div>
              </div>
              <div class="ss-progress">
                <div class="ss-progress-track">
                  <div class="ss-progress-fill" id="ss-progress-fill"></div>
                </div>
                <p class="search-status" id="search-status" role="status"></p>
              </div>
            </section>

            <section class="ss-results">
              <div class="ss-results-head">
                <span class="ss-results-title"
                  >结果 <span class="ss-count" id="ss-count">0</span></span
                >
                <span class="ss-spacer"></span>
                <button type="button" class="gh-button btn-sm" id="ss-sort-distance" data-sort="distance">
                  按距离
                </button>
                <button type="button" class="gh-button btn-sm" id="ss-export">导出结果</button>
              </div>
              <div class="ss-table-wrap">
                <table class="ss-table">
                  <thead>
                    <tr>
                      <th class="ss-col-rank">#</th>
                      <th>区块坐标</th>
                      <th>西北角（方块）</th>
                      <th>东南角（方块）</th>
                      <th id="ss-biome-head">占比</th>
                      <th class="ss-col-go"></th>
                    </tr>
                  </thead>
                  <tbody id="ss-rows"></tbody>
                </table>
              </div>
              <p class="ss-foot" id="ss-foot"></p>
            </section>
          </div>
</main>
      </div>
    </div>

    <!--
      Biome picker for the search conditions. A dialog rather than an inline list:
      choosing among ~60 biomes is a task of its own, and keeping it out of the
      sidebar leaves room for the results below it.
    -->
    <div class="modal" id="biome-modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="biome-modal-title">
        <header class="modal-head">
          <h2 id="biome-modal-title">选择需要的群系</h2>
          <button type="button" class="gh-button btn-sm" id="biome-modal-close">关闭</button>
        </header>
        <div class="modal-body" id="biome-modal-body"></div>
        <footer class="modal-foot">
          <span class="modal-count" id="biome-modal-count"></span>
          <button type="button" class="gh-button btn-sm" id="biome-modal-clear">全不选</button>
          <button type="button" class="gh-button btn-sm search-run" id="biome-modal-ok">确定</button>
        </footer>
      </div>
    </div>


    <!--
      Second biome dialog, for the *excluded* biomes: biomes that must not appear
      inside a result area (or must stay under the share limit). Same shape as the
      picker above so both read the same way.
    -->
    <div class="modal" id="exclude-modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exclude-modal-title">
        <header class="modal-head">
          <h2 id="exclude-modal-title">选择要排除的群系</h2>
          <button type="button" class="gh-button btn-sm" id="exclude-modal-close">关闭</button>
        </header>
        <div class="modal-body" id="exclude-modal-body"></div>
        <footer class="modal-foot">
          <span class="modal-count" id="exclude-modal-count"></span>
          <button type="button" class="gh-button btn-sm" id="exclude-modal-clear">全不选</button>
          <button type="button" class="gh-button btn-sm search-run" id="exclude-modal-ok">确定</button>
        </footer>
      </div>
    </div>

  </body>
</html>
